# =============================================================================
#  Push to main  ->  test (GitHub-hosted)  ->  build + roll out (on the server).
#
#  The server is a phone (arm64) running the stack in Docker, with a
#  self-hosted runner registered under the label `phone`. Two jobs, split on
#  purpose:
#
#    * test runs on GitHub's ubuntu-latest. The tests start Postgres through
#      Testcontainers, and Docker on the phone cannot create the bridge
#      network those containers need.
#    * deploy runs on the phone only after the tests pass. It builds the image
#      natively there, so nothing goes through a registry, and hands it to
#      ~/wekt/deploy.sh, which switches the live build, health-checks it and
#      rolls back on failure.
# =============================================================================
name: Deploy

# Deliberately NO `pull_request` trigger. This repository is public and the
# runner is a personal device, so a pull_request trigger would let anyone
# execute arbitrary code on it by opening a PR. `push` to main can only be
# done by someone who already has write access. Fork PR workflows also need
# manual approval in the repository settings.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One rollout at a time, and never cancel one halfway: a partially applied
# deploy is worse than a queued one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # The committed gradle.properties points the JVM at the Windows trust store
      # (Windows-ROOT) for the dev machine, which does not exist on Linux and
      # breaks every HTTPS download. Same override the Dockerfile applies.
      - name: Use the default trust store
        run: sed -i 's#^org.gradle.jvmargs=.*#org.gradle.jvmargs=-Xmx2048m#' gradle.properties

      # Through bash: gradlew is committed without the executable bit.
      - name: Test
        run: bash ./gradlew build

  deploy:
    needs: test
    runs-on: [self-hosted, phone]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # BuildKit's cache mounts in the Dockerfile keep the Gradle dependency
      # cache warm across builds on the phone.
      - name: Build image
        run: docker build -t "auth-service:${GITHUB_SHA::7}" .

      - name: Roll out
        run: bash /root/wekt/deploy.sh auth-service "${GITHUB_SHA::7}"
