# =============================================================================
#  Single-host deployment: three containers on one small VM.
#
#     Caddy (:80/:443, auto Let's Encrypt)  ->  auth-service (:8080)  ->  Postgres
#
#  Written for an Oracle Cloud Always Free ARM instance (VM.Standard.A1.Flex,
#  2 OCPU / 4 GB) but nothing here is Oracle-specific — any VPS with >= 2 GB RAM
#  and Docker works unchanged. See DEPLOY.md.
#
#  Usage on the host:
#     cp deploy/.env.example .env      # then edit .env with real values
#     docker compose -f deploy/docker-compose.yml --env-file .env up -d --build
# =============================================================================
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # Never published to the host — only auth-service reaches it over the
    # compose network. The DB is not internet-facing at all.
    expose: ["5432"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # auth-service runs Liquibase on startup, so it must not start before the
    # database can actually accept connections.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Two databases live here now (authplatform and portfolio), so a little more
    # room than the 512m this had when it served one.
    mem_limit: 640m

  auth-service:
    # CI builds this image on the self-hosted runner and pushes it to GHCR
    # (.github/workflows/deploy.yml), so this host never compiles anything —
    # a deploy is a pull. AUTH_IMAGE_TAG is the commit sha currently rolled
    # out; deploy/remote-deploy.sh writes it into .env, which is what makes a
    # later bare `docker compose up -d` bring back the SAME build instead of
    # drifting to whatever `latest` points at by then. The fallback covers the
    # first bring-up, before CI has ever run.
    image: ghcr.io/kaushal-bhatt/auth-service:${AUTH_IMAGE_TAG:-latest}
    # Kept so `up -d --build` still works for local development, and so the
    # stack can be brought up on a machine with no access to the registry.
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: [../.env]
    # Only exposed to Caddy on the internal network — never published to the host.
    expose: ["8080"]
    mem_limit: 1200m
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=55 -XX:+UseSerialGC -XX:+ExitOnOutOfMemoryError"

  # The personal site at the bare domain. Built and pushed by the deploy
  # workflow in the kaushal-portfolio repository, exactly like auth-service —
  # this host pulls, it does not build.
  portfolio:
    image: ghcr.io/kaushal-bhatt/portfolio:${PORTFOLIO_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    expose: ["3000"]
    environment:
      # Its own database AND its own Postgres role, not auth-platform's. The
      # site is the more exposed of the two services, and a separate role means
      # a flaw there cannot reach the auth tables. Created once by hand — see
      # DEPLOY.md, "Adding the portfolio".
      DATABASE_URL: postgresql://${PORTFOLIO_DB_USER:-portfolio}:${PORTFOLIO_DB_PASSWORD}@postgres:5432/${PORTFOLIO_DB:-portfolio}
      # Where the browser is sent to sign in.
      AUTH_PLATFORM_URL: https://${AUTH_DOMAIN}
      # Where this container talks to the auth service directly. Both run here,
      # so the code exchange and the JWKS fetch stay on the compose network
      # instead of leaving the box and hairpinning back in through Caddy — a
      # round trip several Docker and NAT setups quietly refuse to make.
      AUTH_PLATFORM_INTERNAL_URL: http://auth-service:8080
      PORTFOLIO_BASE_URL: https://${ROOT_DOMAIN}
      AUTH_PLATFORM_SSO_CLIENT_ID: ${AUTH_PLATFORM_SSO_CLIENT_ID:-portfolio}
      AUTH_PLATFORM_SSO_CLIENT_SECRET: ${AUTH_PLATFORM_SSO_CLIENT_SECRET}
      NODE_ENV: production
    mem_limit: 400m

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [auth-service]
    ports:
      - "80:80"
      - "443:443"
    environment:
      AUTH_DOMAIN: ${AUTH_DOMAIN}
      # Substituted here rather than left to the Caddyfile's own default: an
      # unset variable falls back, but an EMPTY one does not, and an empty site
      # address stops Caddy from starting at all.
      ROOT_DOMAIN: ${ROOT_DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL}
      UPSTREAM: "auth-service:8080"
    # Points at the Caddyfile inside a DIRECTORY mount rather than bind-mounting
    # the file itself.
    #
    # A single-file bind mount attaches to an inode. `git pull` does not edit a
    # file in place — it writes a replacement and renames over it, giving a new
    # inode — so the container carried on serving the previous config while the
    # host showed the new file, and `caddy reload` answered "config is
    # unchanged". A directory mount resolves the name on every open, so the
    # change is actually visible.
    command: ["caddy", "run", "--config", "/etc/caddy/conf/Caddyfile", "--adapter", "caddyfile"]
    volumes:
      - ./:/etc/caddy/conf:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
