# =============================================================================
#  Simplest free-tier deployment: run this on a single EC2 instance.
#  Two containers — the auth-service and Caddy (auto-HTTPS) — with Postgres on
#  Amazon RDS (free tier). This is the lightest-weight option for a 1 GB t3.micro
#  and is the recommended path in DEPLOY-AWS.md. (The ECS-on-EC2 task definition
#  in ecs-task-definition.json is the alternative if you specifically want ECS.)
#
#  Usage on the instance:
#     cp deploy/.env.example .env      # then edit .env with real values
#     docker compose -f deploy/docker-compose.aws.yml --env-file .env up -d --build
# =============================================================================
services:
  auth-service:
    build:
      context: ..
      dockerfile: Dockerfile
    image: auth-service:latest
    restart: unless-stopped
    env_file: [../.env]
    # Only exposed to Caddy on the internal network — never published to the host.
    expose: ["8080"]
    # Keep the JVM within a slice of the tiny instance; the rest is for Caddy,
    # the OS, and swap headroom.
    mem_limit: 700m
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=55 -XX:+UseSerialGC -XX:+ExitOnOutOfMemoryError"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [auth-service]
    ports:
      - "80:80"
      - "443:443"
    environment:
      AUTH_DOMAIN: ${AUTH_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
      UPSTREAM: "auth-service:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
