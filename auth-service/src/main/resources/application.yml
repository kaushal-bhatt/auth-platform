server:
  port: 8080
  # Caddy terminates TLS and proxies to this service, so what the app sees is plain
  # http on an internal host. Without this, Spring rebuilds request URLs from that
  # internal view, and a same-origin browser call from the demo page looks
  # cross-origin to the CORS filter and is rejected. FRAMEWORK makes Spring honour
  # the X-Forwarded-* headers the proxy already sets.
  forward-headers-strategy: framework

spring:
  application:
    name: auth-service
  # This is a stateless bearer-token api - SecurityConfig disables both httpBasic and
  # formLogin - so Spring Boot's default in-memory user is never consulted. Excluding
  # its autoconfiguration stops it being created at all, and with it the "Using
  # generated security password" line that would otherwise sit in production logs.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:postgresql://localhost:5433/authplatform
    username: authplatform
    password: authplatform
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

auth-platform:
  cors:
    allowed-origins:
      - http://localhost:3000
  jwt:
    jwks-uri: http://localhost:8080/.well-known/jwks.json
    expected-issuer: auth-service
    # audience verification is OFF by default (auth-jwt-lib skips the check when this is
    # unset). If you enable it, the value MUST be exactly the string this service puts in the
    # `aud` claim — auth-platform.issuer.audience below. Any other value ("auth-platform",
    # "auth-service", ...) makes every token in the platform fail verification.
    # expected-audience: auth-platform-client
  issuer:
    issuer: auth-service
    # goes into the `aud` claim of every access token. Cross-service contract — keep in sync
    # with auth-platform.jwt.expected-audience above wherever that is enabled.
    audience: auth-platform-client
    access-token-expiry-minutes: 15
    refresh-token-expiry-minutes: 43200
    # must be supplied via the AUTH_PLATFORM_ISSUER_KEY_PROTECTION_SECRET environment
    # variable (or equivalent secret manager injection) — never commit a real value here.
    # the empty default is intentional: if the env var is not set, KeyProtector's blank
    # check trips and startup fails fast with an actionable error, instead of silently
    # falling back to a value that lives in source control. generate one with:
    #   openssl rand -base64 32
    key-protection-secret: ${AUTH_PLATFORM_ISSUER_KEY_PROTECTION_SECRET:}
  webauthn:
    relying-party-id: localhost
    relying-party-name: Auth Platform
    origin: http://localhost:3000
  sso:
    # The relying party allowed to sign users in through this service (see SsoController).
    #
    # No client secret means the redirect flow is OFF, which is the right default for a public
    # repository: a fresh checkout exposes no login surface for a client nobody declared.
    # Configure per deployment via environment variables — the secret must not live in source
    # control:
    #
    #   AUTH_PLATFORM_SSO_CLIENT_SECRET=<openssl rand -base64 32>
    #   AUTH_PLATFORM_SSO_REDIRECT_URIS=https://wekt.in/api/auth/callback
    #   AUTH_PLATFORM_SSO_REQUIRED_ROLE=portfolio-admin
    #
    # One client, flat, and not a map keyed by client id — Spring cannot bind a map from
    # environment variables when the prefix contains a dash, because it cannot tell which
    # underscores were dots and which were dashes. It binds nothing and answers "unknown client".
    #
    # REDIRECT_URIS is a comma-separated list, every entry matched by exact string equality and
    # never by prefix. Setting REQUIRED_ROLE is strongly advised: registration is open, so
    # without it any account that signed up seconds ago satisfies "authenticated".
    client-id: portfolio
    client-secret: ${AUTH_PLATFORM_SSO_CLIENT_SECRET:}
    redirect-uris: ${AUTH_PLATFORM_SSO_REDIRECT_URIS:}
    required-role: ${AUTH_PLATFORM_SSO_REQUIRED_ROLE:}
    # How long a code stays redeemable. Short because it travels in a redirect URL, which ends
    # up in browser history and Referer headers; one server round trip is all it needs to live.
    code-ttl-seconds: 60
    # How long spent and expired code rows are kept before the purge clears them.
    code-retention-minutes: 60
