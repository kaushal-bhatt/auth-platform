databaseChangeLog:
  - changeSet:
      id: 005-create-passkey-challenge-table
      author: auth-platform
      changes:
        - createTable:
            tableName: passkey_challenge
            schemaName: auth
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: challenge
                  type: VARCHAR(128)
                  constraints:
                    nullable: false
                    unique: true
              # TIMESTAMP WITH TIME ZONE, not TIMESTAMP: PasskeyChallengeEntity maps this to
              # java.time.Instant, and spring.jpa.hibernate.ddl-auto=validate runs under test
              # (see auth-service/src/test/resources/application.yml) - a plain TIMESTAMP
              # column would fail that validation against an Instant-typed field. Mirrors
              # TokenEntity/004-create-token-table.yaml's refresh_token_expires_at.
              - column:
                  name: expires_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
