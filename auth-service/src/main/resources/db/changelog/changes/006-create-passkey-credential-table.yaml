databaseChangeLog:
  - changeSet:
      id: 006-create-passkey-credential-table
      author: auth-platform
      changes:
        - createTable:
            tableName: passkey_credential
            schemaName: auth
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              # VARCHAR(1400), not VARCHAR(512): the WebAuthn spec permits credential IDs up to
              # 1023 raw bytes, which base64url-encodes to ~1364 characters. 512 would silently
              # truncate or reject a spec-legal (if unusually large) credential id. 1400 leaves
              # headroom above the 1364 ceiling. Task 14 review addition.
              - column:
                  name: credential_id
                  type: VARCHAR(1400)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: attested_credential_data
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: sign_count
                  type: BIGINT
                  constraints:
                    nullable: false
              # TIMESTAMP WITH TIME ZONE, not TIMESTAMP: PasskeyCredentialEntity maps this to
              # java.time.Instant, and spring.jpa.hibernate.ddl-auto=validate runs under test -
              # a plain TIMESTAMP column would fail that validation. Mirrors
              # TokenEntity/004-create-token-table.yaml's created_at.
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
  # PasskeyCredentialRepository#findByUserId has no supporting index, so it would full-scan
  # passkey_credential as row counts grow. Task 14 review addition, same file/changeSet-file as
  # the table creation above since nothing here has been deployed anywhere yet.
  - changeSet:
      id: 006-create-passkey-credential-table-user-id-index
      author: auth-platform
      changes:
        - createIndex:
            indexName: idx_passkey_credential_user_id
            tableName: passkey_credential
            schemaName: auth
            columns:
              - column:
                  name: user_id
