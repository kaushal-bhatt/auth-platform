# Pointing the JVM at the OS-level truststore makes Gradle trust the
# intercepted chain (and still trusts the public CAs the OS ships).
#   - Windows: Windows-ROOT (SunMSCAPI provider, reads the Windows certificate store)
#   - macOS:   KeychainStore
org.gradle.jvmargs=-Djavax.net.ssl.trustStoreType=Windows-ROOT -Xmx2048m

org.gradle.daemon=true
org.gradle.caching=true
