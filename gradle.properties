# This machine may sit behind a Zscaler TLS-intercepting proxy. The JDK's own cacerts store
# does not trust the Zscaler root CA, so Gradle's dependency downloads can fail with PKIX/SSL
# handshake errors. Pointing the JVM at the OS-level truststore makes Gradle trust the
# intercepted chain (and still trusts the public CAs the OS ships).
#   - Windows: Windows-ROOT (SunMSCAPI provider, reads the Windows certificate store)
#   - macOS:   KeychainStore
org.gradle.jvmargs=-Djavax.net.ssl.trustStoreType=Windows-ROOT -Xmx2048m

org.gradle.daemon=true
org.gradle.caching=true
